apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "far-edge-node-watcher.fullname" . }}
  labels:
    {{- include "far-edge-node-watcher.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  {{- if .Values.role.extraRules }}
  {{- toYaml .Values.role.extraRules | nindent 2 }}
  {{- end }}
