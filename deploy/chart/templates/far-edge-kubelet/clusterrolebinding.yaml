apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "far-edge-kubelet.fullname" . }}
  labels:
    {{- include "far-edge-node-watcher.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "far-edge-kubelet.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "far-edge-kubelet.fullname" . }}
  apiGroup: rbac.authorization.k8s.io