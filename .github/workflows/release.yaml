name: Release

on:
  workflow_dispatch: {}

  push:
    tags:
      - '**'

jobs:
  validate-tag:
    runs-on: self-hosted
    outputs:
      semver-valid: ${{ steps.check-tag.outputs.valid }}
    steps:
      - uses: actions/checkout@v6
      - name: Check if tag is a valid SemVer
        id: check-tag
        run: |
          python3 -u .github/scripts/semver_regex.py
        env:
          TAG: ${{ github.ref_name }}

  format-and-lint:
    needs: validate-tag
    if: needs.validate-tag.outputs.semver-valid == 'true'
    uses: ./.github/workflows/validate.yaml

  build-and-publish:
    runs-on: self-hosted
    needs: format-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Golang
        uses: actions/setup-go@v6
        with:
          go-version: ~1.23

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Github registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "2.9.0"
          args: --config .goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-chart:
    runs-on: self-hosted
    needs: build-and-publish
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "4.0.1"

      - name: Log in to the Github registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          cd deploy
          helm package chart

      - name: Store chart name and version
        id: chart_data
        run: |
          cd deploy/chart
          chart_name=$(yq '.name' Chart.yaml)
          echo "chart_name=$chart_name" >> $GITHUB_OUTPUT

          chart_version=$(yq '.version' Chart.yaml)
          echo "chart_version=$chart_version" >> $GITHUB_OUTPUT

      - name: Push chart to registry
        run: |
          cd deploy
          helm push ${{ steps.chart_data.outputs.chart_name }}-${{ steps.chart_data.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/fita/charts
      
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          draft: true
          tag: ${{ github.ref }}
          file: deploy/${{ steps.chart_data.outputs.chart_name }}-${{ steps.chart_data.outputs.chart_version }}.tgz
          overwrite: true
