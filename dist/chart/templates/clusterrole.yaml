apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "far-edge-node-watcher.fullname" . }}
  labels:
    {{- include "far-edge-node-watcher.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  {{- if .Values.clusterRole.extraRules }}
  {{- toYaml .Values.clusterRole.extraRules | nindent 2 }}
  {{- end }}
